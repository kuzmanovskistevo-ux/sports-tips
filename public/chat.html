<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIPDH CHAT</title>
</head>

<body style="margin:0; padding:0; background:#1e1e1e;">

  <div id="chat_tipdh"></div>

  <script type="text/javascript">
    var chatovodOnLoad = chatovodOnLoad || [];

    chatovodOnLoad.push(function() {
      chatovod.addChatToDivId("chat_tipdh", {
        host: "tipdh.chatovod.com",
        width: "100%",
        height: 380,
        defaultLanguage: "en"
      });
    });

    (function() {
      var po = document.createElement('script');
      po.type = 'text/javascript';
      po.charset = "UTF-8";
      po.async = true;
      po.src = 'https://st1.chatovod.com/api/js/v1.js?4';

      var s = document.getElementsByTagName('script')[0];
      s.parentNode.insertBefore(po, s);
    })();
  </script>

</body>
</html>
